<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="title description">
<title id="title">One workspace. Three model roles. Recorded evidence.</title><desc id="description">Operator uses the Next.js workspace and FastAPI API. A persistent controller orchestrates Red, the target adapter and evaluation. External Red/Judge providers and an independent target API connect to it. Campaign records, a local FTS5 corpus and report artifacts are stored separately.</desc>
