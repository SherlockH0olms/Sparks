<text x="72" y="104" font-size="32" fill="#12243b" class="heading" text-anchor="start">One workspace. Three model roles. Recorded evidence.</text>
<text x="72" y="136" font-size="17" fill="#50657a" class="" text-anchor="start">A versioned application adapter connects autonomous testing to an existing inference server.</text>
