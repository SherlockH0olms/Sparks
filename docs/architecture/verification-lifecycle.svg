<text x="72" y="63" font-size="12" fill="#087f82" class="tag" text-anchor="start">AEGIS LOOP  /  ARCHITECTURE</text>
<text x="72" y="104" font-size="32" fill="#12243b" class="heading" text-anchor="start">Discover. Reproduce. Repair. Verify.</text>
<text x="72" y="136" font-size="17" fill="#50657a" class="" text-anchor="start">A configuration selected in development is frozen before the independent final experiment.</text>
