<text x="1088" y="774" font-size="15" fill="#50657a" class="" text-anchor="start">New, distinct final inputs.</text>
<text x="1088" y="797" font-size="15" fill="#50657a" class="" text-anchor="start">Recorded generation provenance.</text>
