<text x="92" y="553" font-size="20" fill="#12243b" class="heading" text-anchor="start">Compare control candidates</text>
<text x="92" y="581" font-size="15" fill="#50657a" class="" text-anchor="start">A baseline / B policy / C focused / D combined.</text>
<text x="92" y="604" font-size="15" fill="#50657a" class="" text-anchor="start">Applicable E encoding/provenance, F Guardrails, G Presidio.</text>
<text x="92" y="627" font-size="15" fill="#50657a" class="" text-anchor="start">Configuration diffs, prerequisites and artifact hashes.</text>
