<rect x="72" y="719" width="4" height="126" rx="2" fill="#245fe8"/>
<text x="92" y="727" font-size="11" fill="#245fe8" class="tag" text-anchor="start">DEVELOPMENT EVIDENCE</text>
<text x="92" y="756" font-size="20" fill="#12243b" class="heading" text-anchor="start">Security + legitimate-use gates</text>
<text x="92" y="784" font-size="15" fill="#50657a" class="" text-anchor="start">Related replays and shared fresh development inputs.</text>
<text x="92" y="807" font-size="15" fill="#50657a" class="" text-anchor="start">Utility floor, false blocks and allowed utility drop.</text>
<text x="92" y="830" font-size="15" fill="#50657a" class="" text-anchor="start">Qualification and automatic candidate selection.</text>
