<text x="1106" y="271" font-size="15" fill="#50657a" class="" text-anchor="start">Fresh sessions and minimization.</text>
<text x="1106" y="294" font-size="15" fill="#50657a" class="" text-anchor="start">Evidence-backed finding.</text>
