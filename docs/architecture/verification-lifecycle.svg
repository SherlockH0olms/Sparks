<text x="414" y="214" font-size="11" fill="#245fe8" class="tag" text-anchor="start">02  BASELINE</text>
<text x="414" y="243" font-size="20" fill="#12243b" class="heading" text-anchor="start">Establish utility</text>
<text x="414" y="271" font-size="15" fill="#50657a" class="" text-anchor="start">Registered legitimate tasks.</text>
<text x="414" y="294" font-size="15" fill="#50657a" class="" text-anchor="start">Recorded normal behavior.</text>
