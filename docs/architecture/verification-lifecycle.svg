<text x="740" y="452" font-size="11" fill="#087f82" class="tag" text-anchor="start">06  FREEZE</text>
<text x="740" y="481" font-size="20" fill="#12243b" class="heading" text-anchor="start">Freeze selected configuration</text>
<text x="740" y="509" font-size="15" fill="#50657a" class="" text-anchor="start">Immutable artifact/hash and target revision fixed before final generation.</text>
<text x="740" y="532" font-size="15" fill="#50657a" class="" text-anchor="start">Final cases remain separated from discovery/development inputs.</text>
<text x="740" y="555" font-size="15" fill="#50657a" class="" text-anchor="start">A development winner alone is not deployment approval.</text>
