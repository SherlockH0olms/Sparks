<text x="760" y="214" font-size="11" fill="#245fe8" class="tag" text-anchor="start">03  DISCOVERY</text>
<text x="760" y="243" font-size="20" fill="#12243b" class="heading" text-anchor="start">Generate attacks</text>
<text x="760" y="271" font-size="15" fill="#50657a" class="" text-anchor="start">Autonomous cell selection.</text>
<text x="760" y="294" font-size="15" fill="#50657a" class="" text-anchor="start">Actual target execution.</text>
